services:
  mcp-server-sse:
    build:
      context: ..
      dockerfile: phase3_docker/Dockerfile
    image: mcp-pypi-server:latest
    container_name: mcp-pypi-sse-service
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
