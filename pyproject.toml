[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-pypi-madhushankast"
version = "0.1.0"
description = "A production-grade Model Context Protocol (MCP) server ready for PyPI and Docker deployment"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Madhushanka", email = "stmadhushanka067@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "llm", "ai", "claude", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.3.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/madhushankast/MCP-PYPI"
Repository = "https://github.com/madhushankast/MCP-PYPI"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pytest",
]

[project.scripts]
mcp-pypi = "mcp_pypi.main:main"
mcp-server = "mcp_pypi.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pypi"]
